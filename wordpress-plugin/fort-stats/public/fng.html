<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>September FNG Challenge — F3 The Fort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<style>
  /* ── Tokens ──────────────────────────────────────────────────────────────
     Dark-committed: F3 bootcamp poster aesthetic. Every color painted
     explicitly so the page holds on any host ground. */
  :root {
    --ground:    #0a0a12;
    --surface:   #14141f;
    --raised:    #1d1d2c;
    --row-alt:   #191926;
    --border:    #2c2c42;
    --ink:       #eaeaf4;
    --ink-mid:   #a6a6be;
    --ink-dim:   #74748e;
    --gold:      #fbbf24;
    --gold-2:    #f59e0b;
    --blue:      #5b96f7;
    --green:     #34d399;
    --silver:    #9aa5b8;
    --bronze:    #c97c3a;
    --shadow:    0 2px 14px rgba(0,0,0,.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background:
      radial-gradient(ellipse 62% 42% at 50% -12%, rgba(251,191,36,.11), transparent 60%),
      var(--ground);
    color: var(--ink);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: 'Anton', 'Arial Narrow', Impact, sans-serif;
    font-weight: 400;
    letter-spacing: .015em;
    text-transform: uppercase;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  /* grain */
  .grain {
    position: fixed; inset: 0; z-index: 60; pointer-events: none;
    opacity: .22; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: #0a0a12;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { font-size: 1.35rem; color: var(--gold); line-height: 1; }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-txt b { font-size: .84rem; font-weight: 700; letter-spacing: -.01em; }
  .brand-txt small {
    font-size: .58rem; text-transform: uppercase; letter-spacing: .18em;
    color: var(--ink-dim);
  }
  .range { display: flex; align-items: center; gap: 7px; }
  .range span:last-child {
    font-size: .66rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-mid);
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.65)} }

  /* ── Shell ───────────────────────────────────────────────────────────── */
  .shell {
    max-width: 660px; margin: 0 auto; padding: 44px 18px 72px;
    display: flex; flex-direction: column; gap: 56px;
  }

  /* ── Hero ────────────────────────────────────────────────────────────── */
  .hero { position: relative; text-align: center; overflow: hidden; }
  .watermark {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
    font-size: clamp(7rem, 26vw, 15rem); line-height: 1; color: var(--gold);
    opacity: .05; user-select: none; pointer-events: none; z-index: 0;
  }
  .hero > *:not(.watermark) { position: relative; z-index: 1; }
  .eyebrow {
    font-size: .7rem; font-weight: 700; letter-spacing: .32em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .headline {
    font-size: clamp(1.9rem, 6.5vw, 2.9rem); line-height: 1.02;
    margin-top: 8px; text-wrap: balance; color: var(--ink);
  }
  .statrow {
    margin-top: 30px; display: flex; align-items: flex-end;
    justify-content: center; gap: 40px;
  }
  .statnum {
    font-size: clamp(3.6rem, 15vw, 5rem); line-height: .85; color: #fff;
    text-shadow: 0 2px 22px rgba(251,191,36,.28);
  }
  .statnum--sm { font-size: clamp(1.8rem, 7vw, 2.4rem); color: var(--blue); text-shadow: none; }
  .statlbl {
    margin-top: 10px; font-size: .64rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .stat--sm { padding-bottom: 6px; }

  /* ── Block ───────────────────────────────────────────────────────────── */
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .block-head h2 { font-size: 1.5rem; color: var(--ink); }
  .hint {
    font-size: .62rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .zero-note { font-size: .9rem; color: var(--ink-mid); margin-bottom: 16px; }
  .foot-note { font-size: .68rem; color: var(--ink-dim); margin-top: 12px; }

  /* ── Leaderboard ─────────────────────────────────────────────────────── */
  .board { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .board li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  .board li.is-zero { opacity: .38; box-shadow: none; }
  @keyframes rise { from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:none} }

  .row-btn {
    width: 100%; display: flex; align-items: center; gap: 13px;
    padding: 13px 15px; background: none; border: 0;
    font: inherit; color: inherit; text-align: left;
  }
  .row-btn.tappable { cursor: pointer; }
  .row-btn.tappable:hover { background: rgba(255,255,255,.03); }
  .row-btn:disabled { cursor: default; }
  .row-btn:focus-visible {
    outline: 2px solid var(--gold); outline-offset: -2px;
  }
  .rank {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: .72rem; font-weight: 700; color: var(--ink-dim);
  }
  .rank.g1 { background: rgba(251,191,36,.18); color: var(--gold); }
  .rank.g2 { background: rgba(154,165,184,.18); color: var(--silver); }
  .rank.g3 { background: rgba(201,124,58,.18); color: var(--bronze); }
  .ao-name {
    flex: none; width: 150px; font-weight: 600; font-size: .95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track {
    flex: 1; height: 10px; border-radius: 6px;
    background: rgba(255,255,255,.06); overflow: hidden;
  }
  .fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--gold-2), var(--gold));
    transition: width .8s cubic-bezier(.16,1,.3,1);
  }
  .count {
    flex: none; width: 26px; text-align: right;
    font-size: 1.05rem; font-weight: 700; color: var(--gold);
  }
  .is-zero .count { color: var(--ink-dim); }
  .chev {
    flex: none; width: 14px; height: 14px; color: var(--ink-dim);
    transition: transform .2s ease;
  }
  .row-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .detail {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .24s ease;
  }
  .detail.open { grid-template-rows: 1fr; }
  .detail-inner { overflow: hidden; }
  .detail-pad {
    border-top: 1px solid var(--border);
    padding: 11px 15px 13px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .fng {
    display: flex; align-items: baseline; gap: 12px; font-size: .88rem;
  }
  .fng-date {
    flex: none; width: 44px; font-size: .68rem; color: var(--ink-dim);
  }
  .fng-name { font-weight: 500; color: var(--ink); }
  .fng-eh {
    margin-left: auto; text-align: right; font-size: .68rem; color: var(--ink-dim);
  }

  /* ── EH'ers ──────────────────────────────────────────────────────────── */
  .eh-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 13px; overflow: hidden; box-shadow: var(--shadow);
  }
  .eh-card table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .eh-card tr { border-bottom: 1px solid var(--border); }
  .eh-card tr:last-child { border-bottom: 0; }
  .eh-card td { padding: 10px 8px; }
  .eh-card td:first-child { padding-left: 15px; width: 34px; }
  .eh-card td:last-child {
    padding-right: 15px; text-align: right;
    font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums;
  }
  .eh-rank {
    display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 50%; font-size: .64rem; font-weight: 700; color: var(--ink-dim);
  }
  .eh-rank.g1 { background: rgba(251,191,36,.18); color: var(--gold); }
  .eh-rank.g2 { background: rgba(154,165,184,.18); color: var(--silver); }
  .eh-rank.g3 { background: rgba(201,124,58,.18); color: var(--bronze); }
  .eh-name { font-weight: 500; color: var(--ink); }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  .pagefoot { text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .rally {
    font-family: 'Anton', sans-serif; text-transform: uppercase;
    letter-spacing: .04em; font-size: 1rem; color: var(--green);
  }
  .gen { font-size: .64rem; letter-spacing: .08em; color: var(--ink-dim); }

  @media (max-width: 420px) {
    .ao-name { width: 108px; }
    .statrow { gap: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="display brand-mark">F3</span>
    <span class="brand-txt"><b>The Fort</b><small>FNG Challenge</small></span>
  </div>
  <div class="range"><span class="dot"></span><span class="tnum" id="range"></span></div>
</header>

<main class="shell">

  <section class="hero">
    <div class="watermark display" aria-hidden="true">FNG</div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="display headline">Which AO Brings the Most FNGs?</h1>
    <div class="statrow">
      <div class="stat">
        <div class="statnum display tnum" id="fngCount">0</div>
        <div class="statlbl">FNGs this month</div>
      </div>
      <div class="stat stat--sm">
        <div class="statnum statnum--sm display tnum" id="aoCount">0</div>
        <div class="statlbl">AOs on the board</div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 class="display">AO Leaderboard</h2>
      <span class="hint" id="lbHint">tap an AO for names</span>
    </div>
    <p class="zero-note" id="zeroNote" hidden>
      No FNGs logged yet — every AO starts at zero. Get them on the sign-up sheet.
    </p>
    <ul class="board" id="board"></ul>
    <p class="foot-note" id="unattrib" hidden></p>
  </section>

  <section class="block" id="ehBlock" hidden>
    <div class="block-head"><h2 class="display">Top EH'ers</h2></div>
    <div class="eh-card"><table><tbody id="ehBody"></tbody></table></div>
  </section>

  <footer class="pagefoot">
    <p class="rally">EH hard. Get them on the sign-up sheet.</p>
    <p class="gen" id="gen"></p>
  </footer>

</main>

<script>
fetch((window.FORT_STATS_API_BASE || '/api') + '/fng-challenge')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((DATA) => { render(DATA); })
  .catch((e) => {
    console.error(e);
    document.getElementById('eyebrow').textContent = 'Could not load — try again shortly.';
  });

function render(DATA) {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const mDay = (iso) =>
    new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const mShort = (iso) =>
    new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

  // ── Header + hero text ──────────────────────────────────────────────
  $("range").textContent = mShort(DATA.start_date) + " – " + mShort(DATA.end_date);
  $("eyebrow").textContent = DATA.month_label;
  if (!DATA.participating_aos) $("lbHint").hidden = true;
  if (DATA.total_fngs === 0) $("zeroNote").hidden = false;

  const reduceMotion = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function countUp(el, target) {
    if (reduceMotion || target === 0) { el.textContent = target.toLocaleString(); return; }
    const dur = 850, t0 = Date.now();
    const step = () => {
      const p = Math.min((Date.now() - t0) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  countUp($("fngCount"), DATA.total_fngs);
  countUp($("aoCount"), DATA.participating_aos);

  // ── Leaderboard ────────────────────────────────────────────────────
  const maxCount = Math.max(1, ...DATA.aos.map((a) => a.count));

  // standard competition ranking over the scored rows (list is pre-sorted desc)
  let lastCount = null, lastRank = 0;
  DATA.aos.forEach((a, i) => {
    if (a.count > 0) {
      if (a.count !== lastCount) { lastRank = i + 1; lastCount = a.count; }
      a._rank = lastRank;
    }
  });

  const board = $("board");
  DATA.aos.forEach((a, i) => {
    const scored = a.count > 0;
    const li = document.createElement("li");
    li.style.animationDelay = Math.min(i * 22, 400) + "ms";
    if (!scored) li.className = "is-zero";

    const medal = a._rank === 1 ? " g1" : a._rank === 2 ? " g2" : a._rank === 3 ? " g3" : "";
    const rows = a.fngs.map((f) => `
      <div class="fng">
        <span class="fng-date tnum">${esc(mDay(f.date))}</span>
        <span class="fng-name">${esc(f.f3_name)}</span>
        ${f.eh ? `<span class="fng-eh">EH · ${esc(f.eh)}</span>` : ""}
      </div>`).join("");

    li.innerHTML = `
      <button class="row-btn ${scored ? "tappable" : ""}" ${scored ? 'aria-expanded="false"' : "disabled"}>
        <span class="rank${medal} tnum">${scored ? a._rank : "–"}</span>
        <span class="ao-name">${esc(a.ao)}</span>
        <span class="track"><span class="fill" style="width:0%"></span></span>
        <span class="count tnum">${a.count}</span>
        ${scored ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>` : ""}
      </button>
      ${scored ? `<div class="detail"><div class="detail-inner"><div class="detail-pad">${rows}</div></div></div>` : ""}`;

    board.appendChild(li);

    // animate bar after paint
    const fill = li.querySelector(".fill");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.width = Math.round((a.count / maxCount) * 100) + "%";
    }));

    if (scored) {
      const btn = li.querySelector(".row-btn");
      const det = li.querySelector(".detail");
      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", String(!open));
        det.classList.toggle("open", !open);
      });
    }
  });

  if (DATA.unattributed > 0) {
    const el = $("unattrib");
    el.hidden = false;
    el.textContent = DATA.unattributed + " FNG(s) had no AO listed and are not ranked.";
  }

  // ── Top EH'ers ─────────────────────────────────────────────────────
  if (DATA.top_ehers.length) {
    $("ehBlock").hidden = false;
    $("ehBody").innerHTML = DATA.top_ehers.map((p, i) => {
      const m = i === 0 ? " g1" : i === 1 ? " g2" : i === 2 ? " g3" : "";
      return `<tr>
        <td><span class="eh-rank${m}">${i + 1}</span></td>
        <td class="eh-name">${esc(p.name)}</td>
        <td>${p.count}</td>
      </tr>`;
    }).join("");
  }

  // ── Footer ─────────────────────────────────────────────────────────
  $("gen").textContent = "Updated " + new Date(DATA.generated_at).toLocaleString("en-US", {
    month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit",
  });
}
</script>
</body>
</html>
