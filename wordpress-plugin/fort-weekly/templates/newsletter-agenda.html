<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Agenda layout (design canvas "E3 · Agenda + featured item"). Body is built by
  includes/pure/agenda-render.php. Everything here is inlined for email (fortw_prepare_for_email);
  the @media block survives separately, so every override in it needs !important.

  Email rules, from what the old newsletter had to give up (server.js prepareForEmail and the
  template's history):
    - literal colours only: no var() (Gmail), and solid hex rather than rgba() or gradients;
    - layout in real <table>/<td> with width attributes: no grid or flex (Gmail Android keeps
      inline display:table-cell over the @media rules);
    - no ::before / ::after, position or negative margins: quote marks and badges are real text;
    - px sizes only: no rem (Gmail Android's root size differs), clamp() or vw;
    - 600px wide, phone layout at 480px;
    - Gmail drops the web-font <link>, so every stack ends in a system font (no Impact: too heavy);
    - Gmail drops <body> styles, so the background is on the .canvas table;
    - capitals come from text-transform, so a restyle can turn them off;
    - no line clamping or in-email anchors: summaries are cut when the issue is built;
    - places are real links in the theme's colour, or mail apps make them blue links of their own.
  scripts/build-style-previews.mjs checks its newsletter styles against the same list.
-->
<style>
body { margin: 0; padding: 0; background: #0d0e10; color: #d8d6d0; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
a { color: #e8b94a; text-decoration: none; }
table { border-collapse: collapse; }
td { padding: 0; }
img { border: 0; display: block; }
.canvas, .canvas-cell { background-color: #0d0e10; }
.canvas { table-layout: fixed; }
.wrap { max-width: 600px; margin: 0 auto; padding: 24px 16px 32px; }

.mast { margin-bottom: 14px; }
.brand { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1.2px; color: #f0ece4; text-transform: uppercase; }
.issue { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; color: #8a8a82; text-transform: uppercase; }
.amber { color: #e8b94a; }

.ledger { margin-bottom: 24px; border-top: 1px solid #3a3d44; }
.lg-label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1.2px; line-height: 1.5; color: #8a8a82; text-transform: uppercase; padding: 10px 10px 10px 0; border-bottom: 1px solid #24272c; }
.lg-value { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; line-height: 1.5; color: #d8d6d0; padding: 9px 0; border-bottom: 1px solid #24272c; }
.lg-value b { color: #f0ece4; }
.lg-last { border-bottom-color: #3a3d44; }
.bar { margin-top: 7px; }
.bar-fill { background-color: #d4a03c; font-size: 1px; line-height: 1px; }
.bar-rest { background-color: #24272c; font-size: 1px; line-height: 1px; }

.quote { margin: 0 0 24px; }
.qmark { font-family: 'Oswald', Arial, sans-serif; font-size: 44px; line-height: 0.7; color: #d4a03c; }
.qtext { font-size: 18px; line-height: 1.5; font-style: italic; color: #f0ece4; }
.qtext p { margin: 0 0 8px; }
.qby { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1.4px; color: #8a8a82; margin-top: 6px; text-transform: uppercase; }

.featured { background: #181a1e; border: 1px solid #3a3d44; margin: 0 0 28px; }
.feat-media { padding: 16px 0 16px 16px; }
.hero { width: 100%; max-width: 100%; height: auto; }
.featured-body { padding: 16px 18px 18px; }
.badge { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1.2px; padding: 3px 7px; background: #d4a03c; color: #15130e; margin-right: 8px; text-transform: uppercase; }
.fmeta { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 0.8px; color: #8a8a82; text-transform: uppercase; }
.fdate { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.25; letter-spacing: 0.6px; color: #e8b94a; text-transform: uppercase; margin-top: 12px; }
.featured-body .fmeta { display: block; margin-bottom: 10px; }
.meta, .meta-inline, .fmeta { word-break: break-word; line-height: 1.55; }
.ftitle { display: block; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.12; letter-spacing: 0.5px; color: #f0ece4; margin: 10px 0 8px; }
.btn { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; padding: 10px 14px; background: #d4a03c; color: #15130e; text-transform: uppercase; }

.section { margin: 0 0 26px; }
.sec-head { border-bottom: 2px solid #3a3d44; margin-bottom: 4px; }
.sec-head--accent { border-bottom-color: #d4a03c; }
.sec-title { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.9px; color: #f0ece4; padding-bottom: 8px; text-transform: uppercase; }
.sec-aside { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; padding-bottom: 8px; text-transform: uppercase; }

.day { border-bottom: 1px solid #24272c; }
.day-label { padding: 14px 10px 14px 0; text-align: center; }
.dow { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; color: #8a8a82; letter-spacing: 0.6px; text-transform: uppercase; }
.dnum { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 24px; font-weight: 700; line-height: 1; color: #e8b94a; }
.dnum--sm { font-size: 20px; color: #d8d6d0; }
.day-items { padding: 14px 0; }
.item { padding: 0 0 18px; }
.item:last-child { padding-bottom: 0; }
.split-main { padding-right: 12px; }
.thumb { width: 120px; height: auto; background: #24272c; }
.thumb--sm { width: 96px; }

.when { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; margin-bottom: 4px; }
.tag { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; padding: 1px 6px; border: 1px solid #6c7380; margin-left: 8px; text-transform: uppercase; }
.new { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; padding: 1px 6px; background: #e8b94a; color: #15130e; margin-left: 6px; text-transform: uppercase; }
.title { display: block; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.4px; line-height: 1.2; color: #f0ece4; }
.title--sm { display: inline; font-size: 16px; }
.meta { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #a9a79f; margin-top: 3px; }
.meta-inline { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; }
.sum { font-size: 15px; line-height: 1.5; color: #d8d6d0; margin: 6px 0 0; }
.sum--sm { font-size: 14px; line-height: 1.45; color: #b9b7b0; margin-top: 4px; }
.also { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; margin-top: 4px; }
.links { margin-top: 8px; }
.lnk { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 0.8px; color: #e8b94a; }
.links .lnk, .small .lnk, .copy { text-transform: uppercase; }
.sp { display: inline-block; width: 14px; }

.row { border-bottom: 1px solid #24272c; }
.row-date { padding: 12px 10px 12px 0; text-align: center; }
.row td { padding-top: 12px; padding-bottom: 12px; }
.row-head .tag { margin-left: 8px; }

.ongoing { padding: 12px 0; border-bottom: 1px solid #24272c; }

.every { border-top: 1px solid #24272c; padding-top: 14px; margin-bottom: 22px; }
.label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1.4px; color: #8a8a82; text-transform: uppercase; }
.dim { color: #8a8a82; }
.dim2 { color: #a9a79f; }
.ew { margin-top: 10px; }
.ew-col { padding: 0 18px 0 0; }
.ew-head { margin-bottom: 8px; }
.ew-item { margin-bottom: 10px; }
.ew-item .meta { margin-top: 2px; }
.ew-col .small { margin-top: 2px; }
.slt { margin-top: 10px; }
.pills { margin-top: 12px; line-height: 2.6; }
.pill { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; padding: 6px 10px; background: #1e2025; color: #e8b94a; margin: 0 4px 4px 0; white-space: nowrap; }

.footer { border-top: 1px solid #24272c; padding-top: 14px; }
.small { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 0.6px; margin: 10px 0 0; }

@media only screen and (max-width: 480px) {
  .wrap { padding: 18px 14px 28px !important; }
  .brand { font-size: 19px !important; }
  .qtext { font-size: 17px !important; }
  .ftitle { font-size: 22px !important; }
  .feat-media, .featured-body { display: block !important; width: auto !important; }
  .feat-media { padding: 14px 14px 0 !important; }
  .hero { width: 100% !important; }
  .day-label, .row-date { width: 44px !important; }
  .split-main, .split-thumb { display: block !important; width: auto !important; }
  .split-main { padding-right: 0 !important; }
  .split-thumb { padding-top: 12px !important; }
  .thumb { width: 150px !important; }
  .thumb--sm { width: 120px !important; }
  .ew-col { display: block !important; width: auto !important; padding: 0 0 18px 0 !important; }
}
</style>
</head>
<body>
<table role="presentation" class="canvas" width="100%"><tr><td class="canvas-cell">
<div class="wrap">
{{BODY}}
</div>
</td></tr></table>
</body>
</html>
