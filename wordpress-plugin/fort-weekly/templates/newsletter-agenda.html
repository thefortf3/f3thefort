<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Agenda layout (design canvas "E3 · Agenda + featured item"). Body is built by
  includes/pure/agenda-render.php. Everything here is inlined for email (fortw_prepare_for_email);
  the @media block survives separately, so every override in it needs !important.
-->
<style>
body { margin: 0; padding: 0; background: #0d0e10; color: #d8d6d0; font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
a { color: #e8b94a; text-decoration: none; }
table { border-collapse: collapse; }
td { padding: 0; }
img { border: 0; display: block; }
.wrap { max-width: 600px; margin: 0 auto; padding: 24px 16px 32px; }

.mast { margin-bottom: 14px; }
.brand { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1.2px; color: #f0ece4; }
.issue { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1px; color: #8a8a82; }
.amber { color: #e8b94a; }

.chips { margin-bottom: 22px; line-height: 2.2; }
.chip { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #d8d6d0; background: #1e2025; border-radius: 999px; padding: 4px 10px; margin: 0 4px 4px 0; white-space: nowrap; }
.chip b { color: #f0ece4; }
.chip b.amber { color: #e8b94a; }

.quote { margin: 0 0 24px; }
.qmark { font-family: 'Oswald', Arial, sans-serif; font-size: 44px; line-height: 0.7; color: #d4a03c; }
.qtext { font-size: 18px; line-height: 1.5; font-style: italic; color: #f0ece4; }
.qtext p { margin: 0 0 8px; }
.qby { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1.4px; color: #8a8a82; margin-top: 6px; }

.featured { background: #181a1e; border: 1px solid #3a3d44; margin: 0 0 28px; }
.hero { width: 100%; max-width: 100%; height: auto; }
.featured-body { padding: 16px 18px 18px; }
.badge { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1.2px; padding: 3px 7px; background: #d4a03c; color: #15130e; margin-right: 8px; }
.fmeta { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 0.8px; color: #8a8a82; }
.ftitle { display: block; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.12; letter-spacing: 0.5px; color: #f0ece4; margin: 10px 0 8px; }
.btn { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; padding: 10px 14px; background: #d4a03c; color: #15130e; }

.section { margin: 0 0 26px; }
.sec-head { border-bottom: 2px solid #3a3d44; margin-bottom: 4px; }
.sec-head--accent { border-bottom-color: #d4a03c; }
.sec-title { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.9px; color: #f0ece4; padding-bottom: 8px; }
.sec-aside { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; padding-bottom: 8px; }

.day { border-bottom: 1px solid #24272c; }
.day-label { padding: 14px 10px 14px 0; text-align: center; }
.dow { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; color: #8a8a82; letter-spacing: 0.6px; }
.dnum { font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 24px; font-weight: 700; line-height: 1; color: #e8b94a; }
.dnum--sm { font-size: 20px; color: #d8d6d0; }
.day-items { padding: 14px 0; }
.item { padding: 0 0 18px; }
.item:last-child { padding-bottom: 0; }
.split-main { padding-right: 12px; }
.thumb { width: 64px; height: auto; background: #24272c; }

.when { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; margin-bottom: 4px; }
.tag { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; padding: 1px 6px; border: 1px solid #6c7380; margin-left: 8px; }
.new { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; padding: 1px 6px; background: #e8b94a; color: #15130e; margin-left: 6px; }
.title { display: block; font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.4px; line-height: 1.2; color: #f0ece4; }
.title--sm { display: inline; font-size: 16px; }
.meta { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #a9a79f; margin-top: 3px; }
.meta-inline { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; }
.sum { font-size: 15px; line-height: 1.5; color: #d8d6d0; margin: 6px 0 0; }
.sum--sm { font-size: 14px; line-height: 1.45; color: #b9b7b0; margin-top: 4px; }
.also { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; color: #8a8a82; margin-top: 4px; }
.links { margin-top: 8px; }
.lnk { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 0.8px; color: #e8b94a; }
.sp { display: inline-block; width: 14px; }

.row { border-bottom: 1px solid #24272c; }
.row-date { padding: 12px 10px 12px 0; text-align: center; }
.row td { padding-top: 12px; padding-bottom: 12px; }
.row-head .tag { margin-left: 8px; }

.ongoing { padding: 12px 0; border-bottom: 1px solid #24272c; }

.every { border-top: 1px solid #24272c; padding-top: 14px; margin-bottom: 22px; }
.label { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 1.4px; color: #8a8a82; }
.dim { color: #8a8a82; }
.dim2 { color: #a9a79f; }
.pills { margin-top: 12px; line-height: 2.6; }
.pill { display: inline-block; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; padding: 6px 10px; background: #1e2025; color: #e8b94a; margin: 0 4px 4px 0; white-space: nowrap; }

.footer { border-top: 1px solid #24272c; padding-top: 14px; }
.small { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 0.6px; margin: 10px 0 0; }

@media only screen and (max-width: 480px) {
  .wrap { padding: 18px 14px 28px !important; }
  .brand { font-size: 19px !important; }
  .qtext { font-size: 17px !important; }
  .ftitle { font-size: 22px !important; }
  .day-label, .row-date { width: 44px !important; }
}
</style>
</head>
<body>
<div class="wrap">
{{BODY}}
</div>
</body>
</html>
