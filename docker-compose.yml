services:
  newsletter:
    image: newsletter:latest
    container_name: newsletter
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/news.db
      - BASE_URL=https://submit.f3thefort.com
      - MAILCHIMP_API_KEY=${MAILCHIMP_API_KEY}
      - MAILCHIMP_LIST_ID=${MAILCHIMP_LIST_ID}
      - MAILCHIMP_SERVER=${MAILCHIMP_SERVER:-us10}
      - MAILCHIMP_FROM_NAME=${MAILCHIMP_FROM_NAME:-The Fort Weekly}
      - MAILCHIMP_FROM_EMAIL=${MAILCHIMP_FROM_EMAIL}
      - FNG_SHEET_URL=${FNG_SHEET_URL}
      - WORDPRESS_BASE_URL=${WORDPRESS_BASE_URL}
      - WORDPRESS_USERNAME=${WORDPRESS_USERNAME}
      - WORDPRESS_APP_PASSWORD=${WORDPRESS_APP_PASSWORD}
      - WORDPRESS_PREBLAST_CATEGORY=${WORDPRESS_PREBLAST_CATEGORY:-Pre-Blast}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - newsletter
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/nginx/ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
