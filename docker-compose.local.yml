# Local-only preview stack: a throwaway WordPress running the Fort theme and the Fort Weekly
# plugin (events, approvals, newsletter). Nothing here talks to production: Slack stays in
# dry-run, and no Mailchimp or Groq keys are set.
#
#   cp dev.db .local/data/dev.db          # a COPY of the old app's database (for the import)
#   docker compose -f docker-compose.local.yml up -d
#   bash scripts/local/seed-wordpress.sh  # first run only: install WP, sample posts, import events
#
#   site      → http://$DEV_HOST:8088, or any hostname / https proxy that forwards to it
#   wp-admin  → /wp-admin  (admin: password in .local/wp-admin-password;
#                           Fort editor "fortedit": .local/wp-editor-password)
#
# The site takes its address from each request (Host, X-Forwarded-Host/-Proto), so it works
# through a reverse proxy as well as directly.
#
# The old newsletter app is the optional "legacy" profile, used to export its data and serve its
# images during an import, or to compare side by side:
#   docker compose -f docker-compose.local.yml --profile legacy up -d newsletter   # :3002/admin, test123
#
# DEV_HOST is the name your browser uses to reach this machine (default develop.lan); it's the
# site address for wp-cli. Override with e.g. `DEV_HOST=localhost docker compose … up -d`.
#
# Tear down (keeps nothing):  docker compose -f docker-compose.local.yml down -v

services:
  newsletter:
    build: .
    profiles: [legacy]
    environment:
      PORT: "3002"
      ADMIN_PASSWORD: test123
      DB_PATH: /data/dev.db
      BASE_URL: http://${DEV_HOST:-develop.lan}:3002
      SITE_BASE_URL: http://${DEV_HOST:-develop.lan}:8088
      # Public API image URLs stay root-relative; the WordPress container proxies /uploads/ here.
      PUBLIC_ASSET_BASE_URL: ""
      FORT_SHARED_SECRET: local-only-secret
      SITE_FLUSH_URL: http://wordpress/wp-json/fort/v1/flush
      TZ: America/New_York
    ports: ["3002:3002"]
    volumes:
      - ./.local/data:/data
      - ./.local/uploads:/app/public/uploads

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [wpdb:/var/lib/mysql]

  wordpress:
    image: wordpress:6-php8.2-apache
    depends_on: [db]
    ports: ["8088:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      DEV_HOST: ${DEV_HOST:-develop.lan}
      # The live stats API. For the local stats container instead: FORT_STATS_API=http://stats:8080
      FORT_STATS_API: ${FORT_STATS_API:-https://stats.f3thefort.com}
      WORDPRESS_CONFIG_EXTRA: |
        // Site address from the request, so it works directly and behind an https proxy.
        // (Doubled dollar signs are compose's escape for PHP's $.)
        $$fort_https = ( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '' ) === 'https';
        if ( $$fort_https ) { $$_SERVER['HTTPS'] = 'on'; }
        $$fort_host = $$_SERVER['HTTP_X_FORWARDED_HOST'] ?? $$_SERVER['HTTP_HOST'] ?? ( getenv( 'DEV_HOST' ) . ':8088' );
        $$fort_host = preg_replace( '/[^A-Za-z0-9.:-]/', '', explode( ',', $$fort_host )[0] );
        define( 'WP_HOME', ( $$fort_https ? 'https://' : 'http://' ) . $$fort_host );
        define( 'WP_SITEURL', WP_HOME );
        // The reverse proxy in front of this test site passes the visitor's address here.
        define( 'FORT_CLIENT_IP_HEADER', 'HTTP_X_REAL_IP' );
        // Style preview frame at /style-preview/ (try the alternative homepage styles). Local only.
        define( 'FORT_STYLE_PREVIEW', true );
        define( 'FORT_STATS_API', getenv( 'FORT_STATS_API' ) ?: 'https://stats.f3thefort.com' );
        define( 'FORT_STATS_URL', 'https://stats.f3thefort.com' );
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./wordpress-plugin/fort-weekly:/var/www/html/wp-content/plugins/fort-weekly:ro

  wpcli:
    image: wordpress:cli-php8.2
    profiles: [tools]
    depends_on: [wordpress]
    user: "33:33"
    environment:
      DEV_HOST: ${DEV_HOST:-develop.lan}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./wordpress-plugin/fort-weekly:/var/www/html/wp-content/plugins/fort-weekly:ro
      - ./.local/seed:/seed:ro

volumes:
  wp:
  wpdb:
