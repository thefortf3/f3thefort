# Local-only preview stack: the newsletter app + a throwaway WordPress running the Fort theme.
# Nothing here talks to production. Slack stays in dry-run, pre-blast posting is off, and no
# Mailchimp keys are set.
#
#   cp dev.db .local/data/dev.db          # a COPY — the app migrates it on start
#   docker compose -f docker-compose.local.yml up -d --build
#   bash scripts/local/seed-wordpress.sh  # first run only: install WP + import sample posts
#
#   newsletter admin  → http://$DEV_HOST:3002/admin   (password: test123)
#   site              → http://$DEV_HOST:8088, or any hostname / https proxy that forwards to it
#
# The site takes its address from each request (Host, X-Forwarded-Host/-Proto), and entry images
# are served from the site's own origin (/uploads/ is proxied to the app), so it works through a
# reverse proxy as well as directly.
#
# DEV_HOST is the name your browser uses to reach this machine (default develop.lan). It's used
# for the admin's links, the email preview, and as the site address for wp-cli; override with e.g.
# `DEV_HOST=localhost docker compose -f docker-compose.local.yml up -d`.
#
# Tear down (keeps nothing):  docker compose -f docker-compose.local.yml down -v

services:
  newsletter:
    build: .
    environment:
      PORT: "3002"
      ADMIN_PASSWORD: test123
      DB_PATH: /data/dev.db
      BASE_URL: http://${DEV_HOST:-develop.lan}:3002
      SITE_BASE_URL: http://${DEV_HOST:-develop.lan}:8088
      # Public API image URLs stay root-relative; the WordPress container proxies /uploads/ here.
      PUBLIC_ASSET_BASE_URL: ""
      FORT_SHARED_SECRET: local-only-secret
      SITE_FLUSH_URL: http://wordpress/wp-json/fort/v1/flush
      TZ: America/New_York
    ports: ["3002:3002"]
    volumes:
      - ./.local/data:/data
      - ./.local/uploads:/app/public/uploads

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [wpdb:/var/lib/mysql]

  wordpress:
    image: wordpress:6-php8.2-apache
    depends_on: [db, newsletter]
    ports: ["8088:80"]
    # Enable Apache's proxy modules for /uploads/, then hand over to the image's normal start-up.
    command: ["bash", "-c", "a2enmod -q proxy proxy_http && exec docker-entrypoint.sh apache2-foreground"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      DEV_HOST: ${DEV_HOST:-develop.lan}
      WORDPRESS_CONFIG_EXTRA: |
        // Site address from the request, so it works directly and behind an https proxy.
        // (Doubled dollar signs are compose's escape for PHP's $.)
        $$fort_https = ( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '' ) === 'https';
        if ( $$fort_https ) { $$_SERVER['HTTPS'] = 'on'; }
        $$fort_host = $$_SERVER['HTTP_X_FORWARDED_HOST'] ?? $$_SERVER['HTTP_HOST'] ?? ( getenv( 'DEV_HOST' ) . ':8088' );
        $$fort_host = preg_replace( '/[^A-Za-z0-9.:-]/', '', explode( ',', $$fort_host )[0] );
        define( 'WP_HOME', ( $$fort_https ? 'https://' : 'http://' ) . $$fort_host );
        define( 'WP_SITEURL', WP_HOME );
        define( 'FORT_NL_API', 'http://newsletter:3002' );
        define( 'FORT_NL_SECRET', 'local-only-secret' );
        define( 'FORT_STATS_API', getenv( 'FORT_STATS_API' ) ?: 'http://stats:8080' );
        define( 'FORT_STATS_URL', 'https://stats.f3thefort.com' );
        define( 'FORT_API_TTL', 15 );
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./scripts/local/apache-uploads-proxy.conf:/etc/apache2/conf-enabled/fort-uploads-proxy.conf:ro

  wpcli:
    image: wordpress:cli-php8.2
    profiles: [tools]
    depends_on: [wordpress]
    user: "33:33"
    environment:
      DEV_HOST: ${DEV_HOST:-develop.lan}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./.local/seed:/seed:ro

volumes:
  wp:
  wpdb:
