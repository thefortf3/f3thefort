# Local-only preview stack: a throwaway WordPress running the Fort theme and the Fort Weekly
# plugin (events, approvals, newsletter). Nothing here talks to production: Slack stays in
# dry-run, and no Mailchimp or Groq keys are set.
#
#   cp dev.db .local/data/dev.db          # a COPY of the old app's database (for the import)
#   docker compose -f docker-compose.local.yml up -d
#   bash scripts/local/seed-wordpress.sh  # first run only: install WP, sample posts, import events
#
#   site      → http://$DEV_HOST:8088, or any hostname / https proxy that forwards to it
#   wp-admin  → /wp-admin  (admin: password in .local/wp-admin-password;
#                           Fort editor "fortedit": .local/wp-editor-password)
#
# The site takes its address from each request (Host, X-Forwarded-Host/-Proto), so it works
# through a reverse proxy as well as directly.
#
# The old newsletter app is the optional "legacy" profile, used to export its data and serve its
# images during an import, or to compare side by side:
#   docker compose -f docker-compose.local.yml --profile legacy up -d newsletter   # :3002/admin, test123
#
# DEV_HOST is the name your browser uses to reach this machine (default develop.lan); it's the
# site address for wp-cli. Override with e.g. `DEV_HOST=localhost docker compose … up -d`.
#
# Tear down (keeps nothing):  docker compose -f docker-compose.local.yml down -v

services:
  newsletter:
    build: .
    profiles: [legacy]
    environment:
      PORT: "3002"
      ADMIN_PASSWORD: test123
      DB_PATH: /data/dev.db
      BASE_URL: http://${DEV_HOST:-develop.lan}:3002
      SITE_BASE_URL: http://${DEV_HOST:-develop.lan}:8088
      # Public API image URLs stay root-relative; the WordPress container proxies /uploads/ here.
      PUBLIC_ASSET_BASE_URL: ""
      FORT_SHARED_SECRET: local-only-secret
      SITE_FLUSH_URL: http://wordpress/wp-json/fort/v1/flush
      TZ: America/New_York
    ports: ["3002:3002"]
    volumes:
      - ./.local/data:/data
      - ./.local/uploads:/app/public/uploads

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [wpdb:/var/lib/mysql]

  wordpress:
    image: wordpress:7-php8.3-apache
    depends_on: [db]
    ports: ["${WP_PORT:-8088}:80"]
    # GloomSchedule and FNG sheet settings for Fort Stats (written by scripts/local/seed-stats-db.sh).
    env_file:
      - path: .local/stats-wp.env
        required: false
      # Local-only secrets (git-ignored): FORT_GROQ_API_KEY ("Write one for me"), FORT_MAILCHIMP_* (drafts).
      - path: .local/wp-secrets.env
        required: false
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      DEV_HOST: ${DEV_HOST:-develop.lan}
      WP_PORT: ${WP_PORT:-8088}
      WORDPRESS_CONFIG_EXTRA: |
        // Site address from the request, so it works directly and behind an https proxy.
        // (Doubled dollar signs are compose's escape for PHP's $.)
        $$fort_https = ( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '' ) === 'https';
        if ( $$fort_https ) { $$_SERVER['HTTPS'] = 'on'; }
        $$fort_host = $$_SERVER['HTTP_X_FORWARDED_HOST'] ?? $$_SERVER['HTTP_HOST'] ?? ( getenv( 'DEV_HOST' ) . ':' . getenv( 'WP_PORT' ) );
        $$fort_host = preg_replace( '/[^A-Za-z0-9.:-]/', '', explode( ',', $$fort_host )[0] );
        define( 'WP_HOME', ( $$fort_https ? 'https://' : 'http://' ) . $$fort_host );
        define( 'WP_SITEURL', WP_HOME );
        // The reverse proxy in front of this test site passes the visitor's address here.
        define( 'FORT_CLIENT_IP_HEADER', 'HTTP_X_REAL_IP' );
        // Scheduled jobs (Fort Stats' background refresh) run from the wpcron service below, as a
        // real cron job would on the host, not from visitors' page loads.
        define( 'DISABLE_WP_CRON', true );
        // Style preview frame at /style-preview/ (try the alternative homepage styles). Local only.
        define( 'FORT_STYLE_PREVIEW', true );
        // Fort Stats plugin: the local PostgREST (profile "stats") and its local-only anon key.
        define( 'FORT_STATS_REST_URL', getenv( 'FORT_STATS_REST_URL' ) ?: 'http://postgrest:3000' );
        define( 'FORT_GS_API_ENDPOINT', getenv( 'GS_API_ENDPOINT' ) ?: '' );
        define( 'FORT_GS_API_KEY', getenv( 'GS_API_KEY' ) ?: '' );
        define( 'FORT_FNG_SHEET_URL', getenv( 'FNG_SHEET_URL' ) ?: '' );
        define( 'FORT_FNG_START', getenv( 'FNG_START' ) ?: '' );
        define( 'FORT_FNG_END', getenv( 'FNG_END' ) ?: '' );
        // Fort Weekly's summary writer and Mailchimp drafts (.local/wp-secrets.env). Slack stays unset here.
        define( 'FORT_GROQ_API_KEY', getenv( 'FORT_GROQ_API_KEY' ) ?: '' );
        define( 'FORT_MAILCHIMP_API_KEY', getenv( 'FORT_MAILCHIMP_API_KEY' ) ?: '' );
        define( 'FORT_MAILCHIMP_LIST_ID', getenv( 'FORT_MAILCHIMP_LIST_ID' ) ?: '' );
        define( 'FORT_MAILCHIMP_FROM_NAME', getenv( 'FORT_MAILCHIMP_FROM_NAME' ) ?: 'The Fort Weekly' );
        define( 'FORT_MAILCHIMP_FROM_EMAIL', getenv( 'FORT_MAILCHIMP_FROM_EMAIL' ) ?: 'newsletter@f3thefort.com' );
        define( 'FORT_STATS_ANON_KEY', getenv( 'FORT_STATS_ANON_KEY' ) ?: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImxvY2FsIn0.Ig_vcDhxzvoAaC7lpgcdFlrjFIgEkmw5WSZaV9X-NfM' );
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./wordpress-plugin/fort-weekly:/var/www/html/wp-content/plugins/fort-weekly:ro
      - ./wordpress-plugin/fort-stats:/var/www/html/wp-content/plugins/fort-stats:ro

  # Runs WordPress's scheduled jobs every minute, like a cron job on the host would
  # (production: see wordpress-plugin/fort-stats/README.md).
  wpcron:
    image: curlimages/curl:8.10.1
    depends_on: [wordpress]
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null -m 120 -H 'Host: localhost:8088' http://wordpress/wp-cron.php; sleep 60; done"]

  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    depends_on: [wordpress]
    user: "33:33"
    environment:
      DEV_HOST: ${DEV_HOST:-develop.lan}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ./wordpress-theme/fort:/var/www/html/wp-content/themes/fort:ro
      - ./wordpress-plugin/fort-weekly:/var/www/html/wp-content/plugins/fort-weekly:ro
      - ./wordpress-plugin/fort-stats:/var/www/html/wp-content/plugins/fort-stats:ro
      - ./.local/seed:/seed:ro

  # ── Stats over HTTPS (profile "stats"): a local stand-in for the stats Supabase project, for
  # building and checking the Fort Stats plugin without touching Supabase.
  #   docker compose -f docker-compose.local.yml --profile stats up -d
  #   bash scripts/local/seed-stats-db.sh       # copies the live data in (read-only)
  stats-db:
    image: postgres:17
    profiles: [stats]
    environment:
      POSTGRES_PASSWORD: local-stats
    volumes:
      - statsdb:/var/lib/postgresql/data
      - ./scripts/local/stats-db-init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro

  # Supabase's REST API is PostgREST; the plugin talks to this one at http://postgrest:3000.
  postgrest:
    image: postgrest/postgrest:v12.2.3
    profiles: [stats]
    depends_on: [stats-db]
    environment:
      PGRST_DB_URI: postgres://authenticator:local-authenticator@stats-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      # Local only. The matching anon key is FORT_STATS_ANON_KEY below.
      PGRST_JWT_SECRET: local-only-postgrest-jwt-secret-not-for-production
    ports: ["127.0.0.1:3010:3000"]

  # The existing Flask stats app on the same data, for the parity check
  # (scripts/local/stats-parity.mjs). Image: the stats repo's, built locally as f3stats:backblast.
  stats-flask:
    image: ${STATS_FLASK_IMAGE:-f3stats:backblast}
    profiles: [stats]
    depends_on: [stats-db]
    env_file:
      - path: ${STATS_ENV_FILE:-/dev/null}   # GloomSchedule / FNG sheet settings, if given
        required: false
    environment:
      DB_HOST: stats-db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: local-stats
      DB_NAME: postgres
      DB_SSLMODE: disable
      CACHE_TTL: "0"
    ports: ["127.0.0.1:8091:8080"]

volumes:
  wp:
  wpdb:
  statsdb:
